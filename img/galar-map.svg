<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Galar Region Map</title>
  <desc id="desc">Stylized Galar map for region navigation.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec8ff"/>
      <stop offset="100%" stop-color="#4a7ec8"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c8e090"/>
      <stop offset="55%" stop-color="#8fb85a"/>
      <stop offset="100%" stop-color="#4f7f3a"/>
    </linearGradient>
    <linearGradient id="urban" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ccb0"/>
      <stop offset="100%" stop-color="#9a8e68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#204f7a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="1600" fill="url(#ocean)"/>
  <g filter="url(#shadow)">
    <path d="M200 1400 L280 1320 L360 1280 L440 1200 L520 1100 L600 1000 L680 900 L760 820 L840 740 L920 660 L1000 580 L1040 500 L1020 420 L960 360 L880 320 L800 340 L720 400 L640 480 L560 560 L480 640 L400 720 L320 800 L240 880 L200 960 L180 1080 L190 1200 Z"
          fill="url(#land)" stroke="#3d6a28" stroke-width="8"/>
    <ellipse cx="520" cy="920" rx="90" ry="55" fill="url(#urban)" stroke="#5a5040" stroke-width="4" opacity="0.9"/>
    <ellipse cx="760" cy="640" rx="70" ry="45" fill="url(#urban)" stroke="#5a5040" stroke-width="4" opacity="0.85"/>
  </g>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#e8f4ff">GALAR</text>
</svg>
