<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Sinnoh Region Map</title>
  <desc id="desc">Stylized Sinnoh map for region navigation with landmarks.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="100%" stop-color="#4a86c8"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a4cf7a"/>
      <stop offset="55%" stop-color="#7fb05d"/>
      <stop offset="100%" stop-color="#5b8f43"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9da4aa"/>
      <stop offset="100%" stop-color="#6a7279"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#204f7a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="1600" fill="url(#ocean)"/>

  <g filter="url(#shadow)">
