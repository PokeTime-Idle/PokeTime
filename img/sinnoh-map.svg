    <path d="M178 1182 L226 1122 L276 1106 L304 1140 L292 1206 L252 1260 L194 1260 L166 1222 Z"
          fill="url(#land)" stroke="#355d2a" stroke-width="7"/>
    <path d="M572 316 L636 350 L690 420 L708 510 L670 594 L618 646 L566 612 L548 544 L526 482 L538 396 Z"
          fill="url(#mountain)" stroke="#535a60" stroke-width="6" opacity="0.92"/>
    <path d="M518 666 L568 710 L612 792 L606 876 L562 944 L512 970 L486 910 L474 818 L486 742 Z"
          fill="url(#mountain)" stroke="#535a60" stroke-width="6" opacity="0.88"/>
    <path d="M676 1048 L736 1092 L776 1164 L768 1228 L728 1280 L668 1284 L640 1228 L646 1146 Z"
