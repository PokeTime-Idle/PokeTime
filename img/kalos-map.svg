<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Kalos Region Map</title>
  <desc id="desc">Stylized Kalos star-shaped map for region navigation.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="100%" stop-color="#4a86c8"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#b8d878"/>
      <stop offset="55%" stop-color="#8fb85a"/>
      <stop offset="100%" stop-color="#5f8f3a"/>
    </linearGradient>
    <linearGradient id="urban" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c8a0"/>
      <stop offset="100%" stop-color="#9a8e68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#204f7a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="1600" fill="url(#ocean)"/>
  <g filter="url(#shadow)">
    <path d="M600 1400 L520 1320 L440 1280 L380 1200 L360 1100 L400 1000 L480 920 L560 840 L620 760 L680 680 L720 600 L760 520 L800 440 L840 360 L880 280 L920 220 L960 180 L1000 200 L1020 280 L1000 360 L960 440 L920 520 L880 600 L840 680 L800 760 L760 840 L720 920 L680 1000 L640 1080 L600 1160 L560 1240 L520 1320 Z"
          fill="url(#land)" stroke="#3d6a28" stroke-width="8"/>
    <path d="M340 1000 L400 920 L460 880 L520 920 L500 1000 L440 1040 L380 1020 Z"
          fill="url(#land)" stroke="#3d6a28" stroke-width="6"/>
    <path d="M280 720 L340 680 L400 700 L420 760 L380 820 L320 800 Z"
          fill="url(#land)" stroke="#3d6a28" stroke-width="6"/>
    <ellipse cx="408" cy="672" rx="70" ry="45" fill="url(#urban)" stroke="#5a5040" stroke-width="4" opacity="0.9"/>
    <ellipse cx="600" cy="520" rx="55" ry="40" fill="url(#urban)" stroke="#5a5040" stroke-width="4" opacity="0.85"/>
  </g>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#e8f4ff">KALOS</text>
</svg>
