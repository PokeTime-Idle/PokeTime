<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Alola Region Map</title>
  <desc id="desc">Stylized Alola four-island map for region navigation.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7eb8e8"/>
      <stop offset="100%" stop-color="#3d6fa8"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c8e878"/>
      <stop offset="50%" stop-color="#8fc85a"/>
      <stop offset="100%" stop-color="#5a9a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a3d5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="1600" fill="url(#ocean)"/>
  <g filter="url(#shadow)">
    <ellipse cx="880" cy="1180" rx="140" ry="100" fill="url(#island)" stroke="#3d6a28" stroke-width="6"/>
    <ellipse cx="520" cy="900" rx="160" ry="110" fill="url(#island)" stroke="#3d6a28" stroke-width="6"/>
    <ellipse cx="320" cy="520" rx="150" ry="105" fill="url(#island)" stroke="#3d6a28" stroke-width="6"/>
    <ellipse cx="200" cy="1100" rx="130" ry="95" fill="url(#island)" stroke="#3d6a28" stroke-width="6"/>
    <path d="M480 780 L520 720 L580 700 L640 720 L680 780" fill="none" stroke="#8a9aaa" stroke-width="4" opacity="0.5"/>
    <path d="M360 600 L420 640 L480 680" fill="none" stroke="#8a9aaa" stroke-width="4" opacity="0.5"/>
  </g>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#e8f4ff">ALOLA</text>
</svg>
